            padding: 15px;

    <script>
        function switchDomain(domainNum) {
            // Deactivate all tabs and cards
            document.querySelectorAll('.tab-btn').forEach(btn =&gt; btn.classList.remove('active'));
            document.querySelectorAll('.mindmap-card').forEach(card =&gt; card.classList.remove('active'));
            
            // Activate target tab and card
            document.querySelector(".tab-btn[data-domain='" + domainNum + "']").classList.add('active');
            document.getElementById("card-domain-" + domainNum).classList.add('active');
        }
